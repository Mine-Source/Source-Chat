name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B -ntp package

      - name: Leer versión
        id: ver
        run: echo "version=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NovaChat-${{ steps.ver.outputs.version }}
          path: target/NovaChat-*.jar

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: NovaChat v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: target/NovaChat-*.jar
          generate_release_notes: true
          make_latest: true
