# ╔═══════════════════════════════════════════════════════════════════╗
# ║  Source Chat 3.0 — configuración                                     ║
# ║  Casi todo se puede hacer desde el juego: /sourcechat (menú)        ║
# ║  Textos: carpeta lang/ (es.yml, en.yml, o crea otro idioma).      ║
# ║  Formato de texto: MiniMessage · PlaceholderAPI opcional.         ║
# ╚═══════════════════════════════════════════════════════════════════╝

prefix: "<gradient:#8B5CF6:#22D3EE><bold>Source Chat</bold></gradient> <dark_gray>›</dark_gray> "

# ── Módulos ───────────────────────────────────────────────────────────
# Si un módulo se desactiva (o falla) el chat sigue funcionando y no consume recursos.
modules:
  cosmetics: true       # tienda: prefijos, tags, color de nombre/chat, mensajes y títulos
  namesync: true        # apodos + nombre en tab (displayName/playerListName)
  games: true           # minijuegos de chat
  announcements: true   # anuncios automáticos (announcements.yml)
  discord: false        # chat -> Discord por webhook
  tokens: true          # [item] [inv] [ender] [pos]
  mentions: true        # @jugador
  joinquit: true        # mensajes de entrada y salida

# ── Idioma ────────────────────────────────────────────────────────────
language:
  default: es           # código de un archivo de lang/ (es, en, ...)
  per-player: true      # cada jugador puede elegir el suyo con /lang

# ── Identidad (servidores premium y no premium) ──────────────────────
identity:
  mode: auto            # auto = detecta online-mode · uuid · name (recomendado para cracked/proxies)

# ── Economía ──────────────────────────────────────────────────────────
economy:
  provider: auto        # auto (Vault si existe, si no interna) · internal · vault
  symbol: "⛁"

# ── Chat ──────────────────────────────────────────────────────────────
chat:
  enabled: true
  cooldown-ms: 1200
  block-duplicates: true
  caps:
    min-letters: 8
    percent: 70
  blocked-words: []     # expresiones regulares (sin distinguir mayúsculas)
  anti-link:
    enabled: true
    regex: '(?:https?://|www\.)\S+|\b[a-z0-9-]{2,}\.(?:com|net|org|gg|io|xyz|es|mx|ar|co|tk|ml)\b'
    whitelist: ["youtube.com", "youtu.be", "github.com"]
  anti-flood:
    max-repeat: 4       # "holaaaaaa" -> "holaaaa" (0 = desactivado)
  # Se usa el PRIMER formato cuyo permiso tenga el jugador ("" = todos).
  # Placeholders: <channel> <prefix> <tag> <player> <displayname> <message>
  formats:
    - permission: "sourcechat.format.admin"
      format: "<channel><prefix><tag><dark_red><bold>ADMIN</bold></dark_red> <hover:show_text:'<gradient:#F43F5E:#F59E0B><bold><player></bold></gradient><newline><gray>Click para escribirle por privado'><click:suggest_command:'/msg <player> '><displayname></click></hover> <dark_gray>›</dark_gray> <white><message>"
    - permission: ""
      format: "<channel><prefix><tag><hover:show_text:'<gradient:#8B5CF6:#22D3EE><bold><player></bold></gradient><newline><gray>Click para escribirle por privado'><click:suggest_command:'/msg <player> '><gray><displayname></gray></click></hover> <dark_gray>›</dark_gray> <white><message>"

channels:
  default: global
  # Escribe con el atajo (ej. "!hola") o cambia de canal con /channel <id>.
  # radius: -1 = sin límite · world-only: solo el mismo mundo · permission: ver y escribir
  list:
    global:
      display: ""
      shortcut: ""
    local:
      display: "<dark_gray>[<green>Local</green>]</dark_gray> "
      radius: 100
      shortcut: "!"
    staff:
      display: "<dark_gray>[<red><bold>STAFF</bold></red>]</dark_gray> "
      permission: "sourcechat.staffchat"
      shortcut: "#"
      format: "<channel><red><player></red> <dark_gray>›</dark_gray> <yellow><message>"

staffchat:
  channel: staff        # canal que alterna /staffchat

helpop:
  cooldown-seconds: 30

# Texto del chat que se convierte en algo interactivo. Ej: escribir "[discord]".
custom-placeholders:
  discord:
    trigger: "[discord]"
    text: "<#5865F2><bold>[Discord]</bold></#5865F2>"
    hover: "<gray>Click para unirte a nuestro Discord"
    click:
      action: open_url
      value: "https://discord.gg/ejemplo"
  spawn:
    trigger: "[spawn]"
    text: "<green>[Spawn]</green>"
    hover: "<gray>Click para ir al spawn"
    click:
      action: run_command
      value: "/spawn"

# :nombre: se reemplaza por el símbolo (permiso sourcechat.emoji).
emojis:
  ":smile:": "☺"
  ":heart:": "❤"
  ":star:": "★"
  ":check:": "✔"
  ":x:": "✘"
  ":sword:": "⚔"
  ":fire:": "🔥"
  ":skull:": "☠"
  ":arrow:": "➜"

mentions:
  color: "#22D3EE"
  sound: "block.note_block.bell"

tokens:
  snapshot-minutes: 10

welcome:
  enabled: true         # mensaje de bienvenida privado (texto en lang/*.yml: welcome-message)

# ── Anuncios ──────────────────────────────────────────────────────────
# Se administran con /announce y se guardan en announcements.yml
announcements:
  prefix: "<gradient:#8B5CF6:#22D3EE><bold>SOURCE</bold></gradient> <dark_gray>›</dark_gray> "

# ── Cosméticos ────────────────────────────────────────────────────────
cosmetics:
  auto-equip: true              # equipar al comprar
  jointitle-audience: self      # self = solo el que entra · all = todos ven el título

quick:                          # configuración rápida (/sourcechat quick, carpeta quick/)
  base-price: 250               # precio común; rare x2, epic x4, legendary x8
  small-caps: false             # tags en ꜱᴍᴀʟʟ ᴄᴀᴘꜱ
  auto-scan-seconds: 30         # cada cuánto busca archivos nuevos en quick/ (0 = nunca)

# ── Nombres, apodos y tab ─────────────────────────────────────────────
namesync:
  tab: true                     # el apodo/color también se ve en el tab (playerListName)
  tab-format: "<prefix><name>"  # placeholders: <prefix> <tag> <name> <player> (+ PlaceholderAPI)
  nametag: false                # prefijo/tag sobre la cabeza con equipos del scoreboard (puede chocar con otros plugins)

nick:
  min-length: 3                 # longitud visible (sin colores)
  max-length: 16
  max-raw-length: 140           # longitud con etiquetas de color
  allowed-regex: "^[\\p{L}\\p{N}_ ]+$"
  unique: true
  blocked: ["admin", "owner", "staff", "mod"]

# ── Minijuegos ────────────────────────────────────────────────────────
games:
  interval-seconds: 300
  answer-seconds: 30
  min-players: 2
  # math unscramble type trivia reverse missing item roman binary vowels guess sort
  types: [math, unscramble, type, trivia, reverse, missing, item, roman, binary, vowels, guess, sort]
  sound: "entity.experience_orb.pickup"
  words: [creeper, diamante, netherite, esqueleto, redstone, aldeano, obsidiana, enderman, encantamiento, pepita, zombie, pickaxe, village, dragon, lightning]
  trivia:
    - { q: "¿Cuántos corazones tiene un jugador por defecto?", a: "10" }
    - { q: "¿Qué mob explota cerca de los jugadores?", a: "creeper" }
    - { q: "¿Qué material se necesita para encender un portal al Nether?", a: "obsidiana" }
    - { q: "What drops from a Ghast when killed besides gunpowder?", a: "ghast tear" }
  rewards:
    coins: 25                   # monedas (internas o Vault)
    commands: []                # ej: "give %player% diamond 1"

# ── Discord (módulo discord) ──────────────────────────────────────────
discord:
  webhook-url: ""
  username: "Source Chat"
  channels: [global]
